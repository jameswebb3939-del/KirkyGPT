[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-followups"
version = "0.1.0"
description = "Local LLM server and CLI client that generates follow-up questions."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Shyam Popat" }
]

dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pydantic",
  "torch",
  "transformers",
  "datasets",
  "numpy",
  "tqdm",
  "aiohttp",
  "openai",
  "sqlalchemy",
  "aiosqlite",
  "redis>=5.0",
]

[project.optional-dependencies]

dev = [
  "pytest",
  "pytest-asyncio",
  "black",
  "ruff"
]

[project.scripts]
llm-followups = "llm_followups.client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "strict"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: slow tests",
]