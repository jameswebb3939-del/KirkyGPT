[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# Keep pytest's default test discovery rules explicit (prevents accidental misconfig)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Make "src/" imports work (fixes: ModuleNotFoundError: No module named 'src')
pythonpath = ["src"]

# Useful defaults (NO -m filters here)
addopts = "-ra -q"

# If you use pytest-asyncio
asyncio_mode = "strict"

# Register custom markers so you don't get warnings
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: slow tests",
]
