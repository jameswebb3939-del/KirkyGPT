apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: kirk-gpt-inference-alerts
  namespace: kirk-gpt

  labels:
    release: monitoring
    app: kirk-gpt-inference

spec:
  groups:
    - name: kirk-gpt-inference.availability

      rules:
        - alert: KirkGPTHighErrorRateWarning

          expr: |
            (
              sum(
                rate(
                  kirk_gpt_http_requests_total{
                    namespace="kirk-gpt",
                    route="/chat",
                    status_code=~"5.."
                  }[5m]
                )
              )
              /
              clamp_min(
                sum(
                  rate(
                    kirk_gpt_http_requests_total{
                      namespace="kirk-gpt",
                      route="/chat"
                    }[5m]
                  )
                ),
                0.001
              )
            ) > 0.01

          for: 10m

          labels:
            severity: warning
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference error rate is above 1%.

            description: >-
              More than 1% of /chat requests have returned
              HTTP 5xx responses for at least 10 minutes.

            runbook_url: >-
              docs/production/runbook.md#high-error-rate


        - alert: KirkGPTHighErrorRateCritical

          expr: |
            (
              sum(
                rate(
                  kirk_gpt_http_requests_total{
                    namespace="kirk-gpt",
                    route="/chat",
                    status_code=~"5.."
                  }[5m]
                )
              )
              /
              clamp_min(
                sum(
                  rate(
                    kirk_gpt_http_requests_total{
                      namespace="kirk-gpt",
                      route="/chat"
                    }[5m]
                  )
                ),
                0.001
              )
            ) > 0.05

          for: 5m

          labels:
            severity: critical
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference error rate is above 5%.

            description: >-
              More than 5% of /chat requests have returned
              HTTP 5xx responses for at least 5 minutes.

            runbook_url: >-
              docs/production/runbook.md#high-error-rate


    - name: kirk-gpt-inference.latency

      rules:
        - alert: KirkGPTP95LatencyHighWarning

          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(
                  kirk_gpt_inference_duration_seconds_bucket{
                    namespace="kirk-gpt"
                  }[5m]
                )
              )
            ) > 2.5

          for: 10m

          labels:
            severity: warning
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference p95 latency is above 2.5 seconds.

            description: >-
              The p95 inference duration has exceeded the
              production latency SLO for at least 10 minutes.

            runbook_url: >-
              docs/production/runbook.md#high-p95-latency


        - alert: KirkGPTP95LatencyHighCritical

          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(
                  kirk_gpt_inference_duration_seconds_bucket{
                    namespace="kirk-gpt"
                  }[5m]
                )
              )
            ) > 5

          for: 5m

          labels:
            severity: critical
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference p95 latency is above 5 seconds.

            description: >-
              Severe inference latency has persisted for at
              least 5 minutes.

            runbook_url: >-
              docs/production/runbook.md#high-p95-latency


    - name: kirk-gpt-inference.capacity

      rules:
        - alert: KirkGPTInferenceQueueBacklog

          expr: |
            sum(
              kirk_gpt_native_queue_depth{
                namespace="kirk-gpt"
              }
            ) > 16

          for: 5m

          labels:
            severity: warning
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference queue backlog is elevated.

            description: >-
              More than 16 inference requests have remained
              queued across the fleet for at least 5 minutes.

            runbook_url: >-
              docs/production/runbook.md#queue-backlog


        - alert: KirkGPTInferenceQueueBacklogCritical

          expr: |
            sum(
              kirk_gpt_native_queue_depth{
                namespace="kirk-gpt"
              }
            ) > 32

          for: 5m

          labels:
            severity: critical
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference queue backlog is critical.

            description: >-
              More than 32 inference requests have remained
              queued across the fleet for at least 5 minutes.

            runbook_url: >-
              docs/production/runbook.md#queue-backlog


    - name: kirk-gpt-inference.runtime

      rules:
        - alert: KirkGPTNoLoadedRuntime

          expr: |
            sum(
              kirk_gpt_runtime_loaded{
                namespace="kirk-gpt"
              }
            ) < 1

          for: 2m

          labels:
            severity: critical
            service: kirk-gpt-inference

          annotations:
            summary: >-
              No KirkGPT inference runtime is loaded.

            description: >-
              Prometheus has observed no loaded inference
              runtime for at least 2 minutes.

            runbook_url: >-
              docs/production/runbook.md#no-loaded-runtime


        - alert: KirkGPTInferenceMetricsMissing

          expr: |
            absent(
              kirk_gpt_runtime_loaded{
                namespace="kirk-gpt"
              }
            )

          for: 5m

          labels:
            severity: warning
            service: kirk-gpt-inference

          annotations:
            summary: >-
              KirkGPT inference metrics are missing.

            description: >-
              Prometheus has not received the runtime metric
              for at least 5 minutes. The ServiceMonitor,
              service, pod or Prometheus scrape path may be
              unhealthy.

            runbook_url: >-
              docs/production/runbook.md#prometheus-scrape-failure