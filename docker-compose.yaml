services:
  redis:
    image: redis:7-alpine

    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      PYTHONPATH: /app/src

      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"

      RULES_ONLY: "true"

      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL_S: "300"
      REDIS_KEY_PREFIX: kirk_gpt

      REDIS_CHAT_CACHE_ENABLED: "true"
      REDIS_CHAT_CACHE_TTL_S: "600"

    volumes:
      - ./data:/app/data

    ports:
      - "8010:8000"

    depends_on:
      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy